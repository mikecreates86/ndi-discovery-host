# Builds the Mac app on GitHub's Macs, so nobody needs Xcode installed.
# Every push to main rebuilds and replaces the "Latest" release, so the Releases page
# always has the newest zip. (Run's "Artifacts" section also has a copy.)
name: Build app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          # Surface problems as annotations (readable without downloading logs).
          grep -E "error:|failed|Fatal|Executed" test.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          exit $code
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NDI-Discovery-Host
          path: build/*.zip
      - name: Publish as the Latest release
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/*.zip --target "$GITHUB_SHA" --latest \
            --title "Latest (version $(cat VERSION))" \
            --notes "Built automatically from the newest commit on main ($(git rev-parse --short HEAD)). Unzip, drag to Applications, right-click > Open the first time. Needs the free NDI SDK installed."
        env:
          GH_TOKEN: ${{ github.token }}
