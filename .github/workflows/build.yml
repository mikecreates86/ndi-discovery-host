# Builds the Mac app on GitHub's Macs, so nobody needs Xcode installed.
# Runs on every push. Download the zip from the run's "Artifacts" section
# (Actions tab > latest run), or from Releases after tagging a version (git tag v1.0.0).
name: Build app
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          # Surface problems as annotations (readable without downloading logs).
          grep -E "error:|failed|Fatal|Executed" test.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          exit $code
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NDI-Discovery-Host
          path: build/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${{ github.ref_name }}" build/*.zip --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
